services:
  robot0_nav2_sim:
    container_name: robot0_nav2_sim
    restart: no
    network_mode: host
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      # X11
      DISPLAY: ${DISPLAY:-}
      # Wayland
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/tmp/runtime-root}
      # Qt display selection
      QT_X11_NO_MITSHM: "1"
    volumes:
      # X11
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Wayland
      - ${XDG_RUNTIME_DIR:-/tmp}:/tmp/host-runtime:rw
    image: ros2_rust_base:jazzy
    command:
      - bash
      - -c
      - "source /nav2_traffic_ws/install/setup.bash && ros2 launch sp_demo_nav2_bringup cloned_multi_tb3_simulation_launch.py robots:='robot0={x: 0.0, y: 5.0, yaw: 0.0};' use_rviz:=True"
  robot1_nav2_sim:
    container_name: robot1_nav2_sim
    restart: no
    network_mode: host
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      # X11
      DISPLAY: ${DISPLAY:-}
      # Wayland
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/tmp/runtime-root}
      # Qt display selection
      QT_X11_NO_MITSHM: "1"
    volumes:
      # X11
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Wayland
      - ${XDG_RUNTIME_DIR:-/tmp}:/tmp/host-runtime:rw
    image: ros2_rust_base:jazzy
    command:
      - bash
      - -c
      - "source /nav2_traffic_ws/install/setup.bash && ros2 launch sp_demo_nav2_bringup cloned_multi_tb3_simulation_launch.py robots:='robot1={x: 3.0, y: 5.0, yaw: 0.0};' use_rviz:=True"
  next_gen_prototype:
    container_name: next_gen_prototype
    restart: no
    network_mode: host
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    image: ros2_rust_base:jazzy
    command:
      - bash
      - -c
      - "source /nav2_traffic_ws/install/setup.bash && ros2 launch rmf_path_server_demo demo_nav2.launch.py robots:='robot0 robot1'"
  