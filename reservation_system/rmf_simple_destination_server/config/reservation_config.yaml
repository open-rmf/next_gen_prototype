# Example configuration for rmf_simple_destination_server.
# `region`: see `rmf_prototype_msgs/msg/Region.msg`.

# Size of an individual occupancy grid cell, in meters.
grid_size: 0.5

# Predefined safe sets.
#
# These are the regions of the map that robots are allowed to be sent to. A
# requested destination region must lie entirely within one of these safe sets,
# otherwise the destination server rejects the goal with an error.
safe_sets:
  - name: main_floor
    region:
      hint: axis_aligned_rectangle
      points: [0.0, 0.0, 20.0, 20.0]

# Backup parking spaces.
#
# A robot can be diverted to one of these parking spaces while it waits for its
# goal destination to free up. Every parking spot is accessible by every robot.
# Each parking spot must lie within one of the safe sets above.
parking_spots:
  - name: parking_a
    region:
      hint: axis_aligned_rectangle
      points: [0.5, 0.5, 1.5, 1.5]
  - name: parking_b
    region:
      hint: axis_aligned_rectangle
      points: [17.5, 17.5, 18.5, 18.5]
