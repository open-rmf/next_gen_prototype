[package]
name = "rmf_process_executor"
version = "0.1.0"
edition = "2021"

[lib]
name = "rmf_process_executor"
path = "src/lib.rs"

[[bin]]
name = "rmf_process_executor"
path = "src/main.rs"

[[bin]]
name = "conveyor_process_executor"
path = "examples/conveyor_process_executor.rs"

[package.metadata.ros-env]
include = true

[dependencies]
bevy = "0.16"
bevy_ecs = "0.16"
bevy_ros2 = { path = "../../bevy_ros2" }
crossflow = { git = "https://github.com/open-rmf/crossflow", features = ["diagram"] }
futures = "0.3"
rclrs = "0.7.0"
rmf_participant_discovery = { path = "../../rmf_participant_discovery" }
ros-env = "=0.2.0"
schemars = "1.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["time", "rt", "macros", "sync"] }
