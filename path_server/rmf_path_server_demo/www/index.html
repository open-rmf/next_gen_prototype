<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RMF Path Server - Dynamic Web Dashboard</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- ROSLIB.js CDN dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/roslib@1.4.1/build/roslib.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo-glow"></div>
        <i class="fa-solid fa-network-wired logo-icon"></i>
        <h1>RMF Path Server <span>Demo Dashboard</span></h1>
      </div>
      <div class="connection-status" id="connection-status">
        <i class="fa-solid fa-circle-dot status-icon offline"></i>
        <span id="status-text">Disconnected</span>
      </div>
    </header>

    <!-- Main Content Layout -->
    <main class="app-body">
      <!-- Left Control Sidebar -->
      <section class="control-sidebar">
        <div class="panel card glassmorphism">
          <div class="panel-header">
            <i class="fa-solid fa-sliders"></i>
            <h2>Controls</h2>
          </div>
          <div class="panel-body">
            <div class="mode-selector">
              <div class="selector-label">System Mode</div>
              <div class="selector-badge" id="mode-badge">Setup Mode</div>
            </div>

            <div class="action-buttons">
              <button id="btn-add-robot" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i> Add Robot
              </button>
              <button id="btn-send" class="btn btn-success" disabled>
                <i class="fa-solid fa-paper-plane"></i> Send Scenario
              </button>
              <button id="btn-reset" class="btn btn-danger">
                <i class="fa-solid fa-rotate-left"></i> Reset Dashboard
              </button>
            </div>
          </div>
        </div>

        <div class="panel card glassmorphism flex-grow">
          <div class="panel-header">
            <i class="fa-solid fa-robot"></i>
            <h2>Robots List</h2>
          </div>
          <div class="panel-body list-container">
            <div class="empty-list-msg" id="empty-list-msg">
              <i class="fa-solid fa-circle-info"></i>
              <p>No active robots. Click "Add Robot" and click the grid to place one.</p>
            </div>
            <div class="robot-list" id="robot-list">
              <!-- Dynamically populated -->
            </div>
          </div>
        </div>
      </section>

      <!-- Main Canvas Viewport -->
      <section class="canvas-viewport card glassmorphism">
        <div class="viewport-header">
          <div class="viewport-title">
            <i class="fa-solid fa-compass"></i>
            <h2>Grid Visualizer (meters)</h2>
          </div>
          <div class="coordinates-display" id="coords-display">
            X: -- | Y: --
          </div>
        </div>
        <div class="canvas-container">
          <canvas id="grid-canvas" width="600" height="600"></canvas>
          <!-- Interactive helper banner -->
          <div class="instruction-banner" id="instruction-banner">
            Click on the grid to place the robot's starting position.
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- App script -->
  <script src="app.js"></script>
</body>
</html>
