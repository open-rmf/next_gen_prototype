name: Next-Gen Prototype CI

on:
  push:
    branches: [ main, epic/next-gen-base ]
  pull_request:
    branches: [ main, epic/next-gen-base ]
  workflow_dispatch:

jobs:
  ci-check:
    name: Colcon Overlay Build & Test Suite (${{ matrix.rmw_implementation }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/open-rmf/ros2_rust_base:jazzy

    strategy:
      fail-fast: false
      matrix:
        rmw_implementation:
          - rmw_fastrtps_cpp
          - rmw_cyclonedds_cpp

    steps:
      - name: Checkout Prototype Repository
        uses: actions/checkout@v4
        with:
          path: next_gen_ws/src/next_gen_prototype

      - name: Build Prototype Packages (Overlay Workspace)
        working-directory: next_gen_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep update
          apt update
          if [ "${{ matrix.rmw_implementation }}" = "rmw_cyclonedds_cpp" ]; then
            apt install -y ros-jazzy-rmw-cyclonedds-cpp
          fi
          rosdep install --from-paths . --ignore-src -y --skip-keys="rclrs ament_cargo ament_python"
          colcon build
        shell: bash

      - name: Run Automated Verification Tests
        working-directory: next_gen_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          export ROS_LOCALHOST_ONLY=1
          export RMW_IMPLEMENTATION=${{ matrix.rmw_implementation }}
          colcon test --executor sequential --packages-select rmf_path_server_test rmf_reservation_tests rmf_path_server_demo --event-handlers console_direct+
          colcon test-result --all
        shell: bash

