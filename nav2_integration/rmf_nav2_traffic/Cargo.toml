[package]
name = "rmf_nav2_traffic"
version = "0.1.0"
edition = "2021"

[lib]
name = "nav2_traffic"

[[bin]]
path = "src/main.rs"
name = "nav2_traffic"

[package.metadata.ros-env]
include = true

[package.metadata.ros]
install_to_share = ["config"]

[dependencies]
axum = "0.8"
bevy = "0.16"
bevy_ecs = "0.16"
bevy_ros2 = { path = "../../bevy_ros2" }
crossbeam = "0.8"
crossflow = { git = "https://github.com/open-rmf/crossflow" }
futures = "0.3"
mapf = { git = "https://github.com/open-rmf/mapf" }
mapf_post = { git = "https://github.com/arjo129/mapf_post" }
nalgebra = "0.34"
rclrs = "0.7"
reqwest = { version = "0.13", features = ["json", "blocking"] }
ros-env = "0.2"
rosidl_runtime_rs = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.52", features = ["full"] }
uuid = "1"
