[package]
name = "rmf_nav2_traffic"
version = "0.1.0"
edition = "2021"

[lib]
name = "nav2_traffic"

[[bin]]
path = "src/main.rs"
name = "nav2_traffic"

[[bin]]
path = "src/bin/nav2_execution.rs"
name = "nav2_execution"

[[bin]]
path = "src/bin/nav2_mock_server.rs"
name = "nav2_mock_server"

[dependencies]
crossbeam = "0.8"
env_logger = "0.11"
futures = "0.3"
log = "0.4"
nalgebra = "0.34"
rclrs = "0.7.0"
ros-env = "=0.2.0"
rosidl_runtime_rs = "0.6"
tokio = { version = "1.52", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
